$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'cpp'
layer: 'application'
stack: 'systems'
tags: ['cmake']

# phosphor-shell/tests reads plasmazones/data/surface at runtime
# (PZ_BUNDLED_SURFACE_DIR, test_shell_chrome), and `dependsOn` does NOT cover
# that: affectedness does not propagate from a dependency to its dependent, so
# editing a bundled surface pack would mark only plasmazones affected and this
# tier's tests would not run under `--affected`. The workspace-relative test
# input below is what closes it, the same way phosphor/moon.yml does for
# data/animations and data/pointer.
dependsOn:
  - 'phosphor'
  - 'phosphor-shell-libs'

project:
  name: 'Phosphor shell'
  description: 'The phosphor-shell binary, the phosphorctl IPC CLI, the bundled shell QML tree and the shell unit tests.'

tasks:
  test:
    inputs:
      - '/plasmazones/data/surface/**/*'
