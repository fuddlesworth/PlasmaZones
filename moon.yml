$schema: 'https://moonrepo.dev/schemas/project.json'

# The repository root: the checks that span every tier. The tiers
# themselves are the four projects listed in .moon/workspace.yml.
language: 'python'
layer: 'configuration'
tags: ['repo']

project:
  name: 'Repository checks'
  description: 'Conventions, schema validation and other whole-tree gates.'

tasks:
  # One configure per configuration for the whole tree. Every tier's build
  # task depends on the matching one, so it runs once per moon invocation
  # rather than once per tier. The configurations themselves live in
  # CMakePresets.json: `debug` configures into build/, `release` into
  # build-release/, so the two coexist and a plain `cmake --preset release`
  # gives the same tree without moon.
  configure:
    command: 'cmake --preset debug'
    inputs:
      - 'CMakePresets.json'
      - 'CMakeLists.txt'
      - 'cmake/**/*'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.cmake.in'
    options:
      cache: false

  # Overrides `args`, not `command`, and replaces rather than appends. moon
  # splits `command: 'cmake --preset debug'` into command `cmake` plus args
  # `[--preset, debug]`, and the default arg merge is APPEND, so overriding
  # only the command string resolved to `cmake --preset debug --preset
  # release`. That configured the right tree purely because CMake takes the
  # last --preset, which is a tiebreak this workflow should not depend on.
  # build-release and test-release already spell it this way.
  configure-release:
    extends: 'configure'
    args:
      - '--preset'
      - 'release'
    options:
      mergeArgs: 'replace'

  # The checker walks every tracked file, so the input set has to be just as
  # wide or moon serves a cached PASS for a change it never inspected. The
  # parts it actually inspects are scripts/*.py and the four tier trees plus
  # packaging/ and .github/workflows/. cmake/ and CMakePresets.json are listed
  # as over-broad insurance rather than because a rule reads them: no rule
  # inspects .cmake or .json at those paths. Over-breadth costs a cache miss;
  # under-breadth costs a missed check.
  conventions:
    command: 'python3 scripts/check-conventions.py'
    inputs:
      - 'scripts/**/*'
      - 'cmake/**/*'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'CLAUDE.md'
      - 'phosphor-libs/**/*'
      - 'phosphor-shell-libs/**/*'
      - 'phosphor-shell/**/*'
      - 'plasmazones/**/*'
      - 'packaging/**/*'
      # .github because rule_prose now takes .github/workflows/*.yml through
      # the pkgdesc arm. This task is CACHED, so without the input moon would
      # replay a pass for a workflow edit it never looked at.
      - '.github/**/*'

  schemas:
    command: 'python3 scripts/validate-json-schemas.py'
    inputs:
      - 'scripts/validate-json-schemas.py'
      - 'phosphor-libs/data/schemas/**/*'
      - 'plasmazones/data/**/*.json'

  # ECM's KDECMakeSettings registers appstreamtest at the BUILD ROOT, not
  # under any tier, so `ctest --test-dir build/<tier>` never sees it and no
  # tier's test task runs it. It is the only such entry (1 of 568), hence
  # the explicit name rather than a directory scope; if ECM ever adds
  # another root-scoped test, it belongs on this line.
  #
  # It validates the installed .metainfo.xml against install_manifest.txt,
  # so it is only meaningful in a tree that has been installed. Without a
  # manifest appstreamtest.cmake prints "Not installed yet, skipping" and
  # passes having checked nothing, which is why this is not a dep of
  # repo:check -- a green run here does not by itself mean the metadata
  # was validated.
  #
  # --no-tests=error because a ctest -R that matches nothing exits 0. ECM
  # registers appstreamtest only when appstreamcli is found at configure
  # time, so without it this task would run, match zero tests and report
  # green having checked nothing at all.
  test:
    command: 'ctest --test-dir build -R ^appstreamtest$ --no-tests=error'
    # configure, not a build. All this needs is build/CTestTestfile.cmake,
    # which the configure generates; appstreamtest reads the INSTALLED
    # metainfo via install_manifest.txt, and compiling four tiers does not
    # produce one.
    deps:
      - '~:configure'
    options:
      cache: false

  check:
    deps:
      - '~:conventions'
      - '~:schemas'

  # Whole-tree install, the moon equivalent of `make install`. It lives here
  # rather than on the tiers because CMake cannot install a subset: none of
  # the 319 install() rules declares a COMPONENT, so
  # `cmake --install build --component <tier>` would install nothing. Giving
  # each tier its own install verb means tagging every rule with a component
  # first, which is a change of its own.
  #
  # Installing to the default prefix needs root, so this is a task you run,
  # not one the build depends on. Override the destination without root with
  # `DESTDIR=/tmp/stage moon run repo:install`, which is what the packagers
  # do. Run repo:post-install afterwards to refresh the KDE service cache.
  install:
    command: 'cmake'
    args:
      - '--install'
      - 'build'
    # phosphor-shell is last in the tier graph (its moon.yml dependsOn phosphor,
    # phosphor-shell-libs and plasmazones), so this one edge builds all four
    # through `^:build`. Depending on plasmazones alone is not enough: the debug
    # preset sets BUILD_PHOSPHOR_SHELL=ON, so the configure generates install
    # rules for shell-tier targets, and `phosphor_tier_target()` collects only
    # targets declared under its own directory — `cmake --install` would then
    # hit `file(INSTALL)` on binaries that were never built.
    deps:
      - 'phosphor-shell:build'
    options:
      cache: false
      runInCI: false

  post-install:
    command: 'sh'
    args:
      - 'cmake/post-install-sycoca.sh'
    options:
      cache: false
      runInCI: false
