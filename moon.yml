$schema: 'https://moonrepo.dev/schemas/project.json'

# The repository root: the checks that span every tier. The tiers
# themselves are the four projects listed in .moon/workspace.yml.
language: 'python'
layer: 'configuration'
tags: ['repo']

project:
  name: 'Repository checks'
  description: 'Conventions, schema validation and other whole-tree gates.'

tasks:
  # One configure per configuration for the whole tree. Every tier's build
  # task depends on the matching one, so it runs once per moon invocation
  # rather than once per tier. The configurations themselves live in
  # CMakePresets.json: `debug` configures into build/, `release` into
  # build-release/, so the two coexist and a plain `cmake --preset release`
  # gives the same tree without moon.
  configure:
    command: 'cmake --preset debug'
    inputs:
      - 'CMakePresets.json'
      - 'CMakeLists.txt'
      - 'cmake/**/*'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.cmake.in'
    options:
      cache: false

  configure-release:
    extends: 'configure'
    command: 'cmake --preset release'

  # The checker walks every tracked file, so the input set has to be just as
  # wide or moon serves a cached PASS for a change it never inspected. cmake/
  # and the rest of scripts/ carry SPDX headers the spdx and license rules
  # police, and the checker itself reads CMakePresets.json's siblings.
  conventions:
    command: 'python3 scripts/check-conventions.py'
    inputs:
      - 'scripts/**/*'
      - 'cmake/**/*'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'CLAUDE.md'
      - 'phosphor/**/*'
      - 'phosphor-shell-libs/**/*'
      - 'phosphor-shell/**/*'
      - 'plasmazones/**/*'
      - 'packaging/**/*'

  schemas:
    command: 'python3 scripts/validate-json-schemas.py'
    inputs:
      - 'scripts/validate-json-schemas.py'
      - 'phosphor/data/schemas/**/*'
      - 'plasmazones/data/**/*.json'

  check:
    deps:
      - '~:conventions'
      - '~:schemas'

  # Whole-tree install, the moon equivalent of `make install`. It lives here
  # rather than on the tiers because CMake cannot install a subset: none of
  # the 319 install() rules declares a COMPONENT, so
  # `cmake --install build --component <tier>` would install nothing. Giving
  # each tier its own install verb means tagging every rule with a component
  # first, which is a change of its own.
  #
  # Installing to the default prefix needs root, so this is a task you run,
  # not one the build depends on. Override the destination without root with
  # `DESTDIR=/tmp/stage moon run repo:install`, which is what the packagers
  # do. Run repo:post-install afterwards to refresh the KDE service cache.
  install:
    command: 'cmake'
    args:
      - '--install'
      - 'build'
    # phosphor-shell is last in the tier graph (its moon.yml dependsOn phosphor,
    # phosphor-shell-libs and plasmazones), so this one edge builds all four
    # through `^:build`. Depending on plasmazones alone is not enough: the debug
    # preset sets BUILD_PHOSPHOR_SHELL=ON, so the configure generates install
    # rules for shell-tier targets, and `phosphor_tier_target()` collects only
    # targets declared under its own directory — `cmake --install` would then
    # hit `file(INSTALL)` on binaries that were never built.
    deps:
      - 'phosphor-shell:build'
    options:
      cache: false
      runInCI: false

  post-install:
    command: 'sh'
    args:
      - 'cmake/post-install-sycoca.sh'
    options:
      cache: false
      runInCI: false
