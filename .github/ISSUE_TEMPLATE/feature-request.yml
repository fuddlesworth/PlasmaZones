name: Feature request
description: Suggest something new or a change to how something works
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the open and closed issues first, in case it has been asked for already.
  - type: textarea
    id: request
    attributes:
      label: What you'd like
      description: The feature or change, as you'd use it.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What it solves
      description: The problem it fixes or what it would let you do that you can't now.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Optional. Workarounds or other approaches you considered.
