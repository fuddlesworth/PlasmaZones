$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'cpp'
layer: 'application'
stack: 'systems'
tags: ['cmake']

dependsOn:
  - 'phosphor-libs'

project:
  name: 'PlasmaZones'
  description: 'Window snapping, tiling and scrolling for KDE Plasma. Covers the daemon, editor, settings, KCM, KWin effect, bundled data and tests.'

tasks:
  # The mirror image of the note in phosphor-libs/moon.yml. Two tests registered in
  # THIS tier depend on phosphor-libs/libs/phosphor-tiles/src/pluau/pluau.luau:
  # test_pluau_helpers opens it from disk via PHOSPHOR_SOURCE_DIR, and
  # test_luau_parity consumes the same file through the Qt resource baked
  # into PhosphorTiles. Either way an edit to the prelude changes what they
  # assert, and affectedness does not propagate from a dependency to its
  # dependent. So
  # editing the prelude marks only `phosphor-libs` affected, `moon run :test
  # --affected` runs ctest against build/phosphor-libs, and the only tests that pin
  # those helpers never run. A workspace-relative input (leading `/`) closes
  # the gap; task inputs merge with the inherited set rather than replacing it.
  #
  # The QML sweep in test_shader_item_qml_bindings is here for the same reason:
  # it reads phosphor-surface-quick's shipped QML (SurfaceDecoration.qml is the
  # only library host that drives a guarded texture property), so an edit there
  # changes what it asserts while marking only `phosphor-libs` affected.
  #
  # phosphor-shaders is the same again: its preamble, include resolver and
  # entry-point assembly are pinned by test_shader_param_preamble,
  # test_shader_include_resolver and test_shader_entry_point, which live in
  # this tier, and the shader validator gates and GPU bake tests here compile
  # every bundled pack through them. The compositor vertex stages the
  # animation, surface and pointer registries carry are compiled by those same
  # gates and by test_animation_pack_bakes and the GPU bake tests, and by no
  # test in phosphor-libs.
  test:
    inputs:
      - '/phosphor-libs/libs/phosphor-tiles/src/pluau/pluau.luau'
      - '/phosphor-libs/libs/phosphor-surface-quick/qml/**/*.qml'
      - '/phosphor-libs/libs/phosphor-shaders/src/**/*'
      - '/phosphor-libs/libs/phosphor-shaders/include/**/*'
      - '/phosphor-libs/libs/phosphor-animation/src/animationshaderregistry.cpp'
      - '/phosphor-libs/libs/phosphor-surface/src/surfaceshaderregistry.cpp'
      - '/phosphor-libs/libs/phosphor-pointer/src/pointershaderregistry.cpp'
