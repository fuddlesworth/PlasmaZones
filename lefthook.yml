# Lefthook git hooks for PlasmaZones
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    clang-format:
      glob: "*.{cpp,h,hpp,cc,cxx}"
      run: clang-format -i {staged_files}
      stage_fixed: true
    qmlformat:
      glob: "*.qml"
      # Resolve qmlformat robustly. The Qt6 binary is named `qmlformat` but is
      # often not on PATH (Arch ships it under /usr/lib/qt6/bin), and some
      # distros suffix it `qmlformat6` / `qmlformat-qt6`. Try PATH names first,
      # then the Qt6 install-bins dir reported by qtpaths6 / qmake6, then a
      # known Arch path; fail with a clear message if none resolve. Without
      # this, a stale/absent PATH entry makes every QML commit abort with an
      # opaque "command not found".
      run: >
        sh -c 'for c in qmlformat6 qmlformat-qt6 qmlformat; do command -v "$c" >/dev/null 2>&1 && exec "$c" -i "$@"; done;
        bins=$(qtpaths6 --query QT_INSTALL_BINS 2>/dev/null || qmake6 -query QT_INSTALL_BINS 2>/dev/null);
        for p in "$bins/qmlformat" /usr/lib/qt6/bin/qmlformat; do [ -x "$p" ] && exec "$p" -i "$@"; done;
        echo "qmlformat not found on PATH or under the Qt6 install bins; install the Qt6 declarative tools" >&2; exit 1' sh {staged_files}
      stage_fixed: true
    json-schema:
      # Explicit per-type globs mirroring scripts/validate-json-schemas.py's
      # SCHEMA_MAP (plus the schemas dir, so editing a schema re-checks its
      # data). A single `data/**/*.json` does NOT match reliably in lefthook's
      # matcher, so the paths are enumerated.
      glob:
        - "plasmazones/data/layouts/*.json"
        - "plasmazones/data/scrolling-templates/*.json"
        - "plasmazones/data/curves/*.json"
        - "plasmazones/data/animations/*/metadata.json"
        - "plasmazones/data/overlays/*/metadata.json"
        - "plasmazones/data/surface/*/metadata.json"
        - "plasmazones/data/pointer/*/metadata.json"
        - "phosphor-libs/data/schemas/*.json"
        - "plasmazones/data/schemas/*.json"
        - "plasmazones/data/whatsnew.json"
      # Hard gate: when a schema-governed data file or a schema itself is
      # staged, validate the whole mapped set against the committed JSON
      # Schemas (the same files runtime validation compiles) and fail the
      # commit on any mismatch, so data and schemas can't drift apart.
      # Validates the full set rather than just staged files so a schema edit
      # re-checks every governed document. The script bootstraps a cached venv
      # with jsonschema on first run (no global install needed), so the gate
      # always runs; it only exits non-zero if validation fails or the
      # validator genuinely can't be obtained (e.g. offline first run).
      run: python3 scripts/validate-json-schemas.py
    conventions:
      # The CLAUDE.md rules that are decidable by inspection: SPDX headers,
      # the GPL-3 app / LGPL-2.1 libs/phosphor-* split (any tier's libs/
      # directory), the file-size ceiling
      # (growth-only, against scripts/oversize-baseline.json), i18n() in C++,
      # inline config paths that should be ConfigDefaults:: accessors, `.pragma
      # library` in QML .js libraries, the DEP-5 copyright file, the plain-prose
      # rules on user-facing strings, and the shared description a chain-resolved
      # shader param carries on every pack. Only the staged files are checked so
      # the hook stays instant, with TWO exceptions. shared-param-text is a
      # whole-set rule and compares all twenty packs whenever this hook runs at
      # all, so it can name a file this commit did not stage; and dep5 widens to
      # the whole tree when packaging/debian/copyright is itself staged. A commit
      # that stages nothing matching the globs below runs neither, because the
      # gate returns before any rule. CI's whole-tree run is the backstop.
      #
      # Stdlib-only, so unlike the schema hook there is no venv to bootstrap
      # and this is always a hard gate.
      glob:
        # `js` is here for the js-pragma rule. Without it a staged .js matches
        # no entry, lefthook passes no files, and the rule that exists to stop
        # a pragma drifting past Qt's 128-byte window would only ever fire in
        # CI, which is the wall-of-warnings-from-files-nobody-edited case it
        # was written to prevent.
        - "*.{cpp,cc,cxx,h,hpp,qml,luau,py,frag,vert,glsl,js}"
        - "plasmazones/data/**/*.json"
        # `plasmazones/data/**/*.json` does not match a file sitting directly
        # in data/, and whatsnew.json is a prose surface CLAUDE.md names, so
        # it needs its own entry.
        - "plasmazones/data/*.json"
        - "phosphor-libs/data/**/*.json"
        - "phosphor-libs/data/*.json"
        - "*.desktop*"
        - "*.metainfo.xml*"
        - "packaging/**"
        - "CHANGELOG.md"
        # The prose rule reaches .github/workflows/*.yml for the generated
        # pkgdesc strings; without this entry that arm is CI-only, which is
        # the same gap the js entry above exists to close.
        - ".github/workflows/*.yml"
      run: python3 scripts/check-conventions.py --staged {staged_files}
    conventions-selftest:
      # Only when the gate itself is edited. A rule that narrows reports a clean
      # tree, so the whole-tree run above cannot catch its own blind spots.
      glob: "scripts/check-conventions.py"
      run: python3 scripts/check-conventions.py --selftest
    shader-validate:
      glob: "plasmazones/data/overlays/**/*.{frag,vert,glsl,json}"
      # When any bundled zone-shader file is staged, validate the whole pack set
      # (metadata parse + headless glslang bake of every stage) via T1.2's
      # plasmazones-shader-validate, so a broken p_<id>/preamble/include never
      # lands. --quiet prints only failing packs. Best-effort: the hook can't
      # build the binary, so if it isn't built yet it skips (with a note) rather
      # than blocking the commit; CI's shader_validate_bundled is the hard gate.
      run: >
        sh -c 'bin=build/bin/plasmazones-shader-validate;
        if [ -x "$bin" ]; then exec "$bin" --quiet --overlay plasmazones/data/overlays;
        else echo "plasmazones-shader-validate not built (build/bin/) — skipping shader validation; build the target to enable this local gate" >&2; fi'
    shader-validate-animation:
      glob: "plasmazones/data/animations/**/*.{frag,vert,glsl,json}"
      # Animation packs are the second authoring model and have their own CI
      # gate (shader_validate_animations); without a local hook, edits under
      # data/animations/** were the only shader tree with no pre-commit
      # validation. Same best-effort skip when the binary isn't built.
      run: >
        sh -c 'bin=build/bin/plasmazones-shader-validate;
        if [ -x "$bin" ]; then exec "$bin" --quiet --animation plasmazones/data/animations;
        else echo "plasmazones-shader-validate not built (build/bin/) — skipping animation shader validation; build the target to enable this local gate" >&2; fi'
    shader-validate-surface:
      glob: "plasmazones/data/surface/**/*.{frag,vert,glsl,json}"
      # Surface (decoration) packs use a distinct authoring model, so validate
      # them with --surface separately from the overlay packs above. Same
      # best-effort skip when the binary isn't built; CI's
      # shader_validate_surface is the hard gate.
      run: >
        sh -c 'bin=build/bin/plasmazones-shader-validate;
        if [ -x "$bin" ]; then exec "$bin" --quiet --surface plasmazones/data/surface;
        else echo "plasmazones-shader-validate not built (build/bin/) — skipping surface shader validation; build the target to enable this local gate" >&2; fi'
    shader-validate-pointer:
      glob: "plasmazones/data/pointer/**/*.{frag,vert,glsl,json}"
      # Pointer packs are the fourth authoring model, with their own CI gate
      # (shader_validate_pointer). Without this hook they would be the only
      # shader tree with no pre-commit validation, which is the gap the
      # animation hook above was added to close. Same best-effort skip when the
      # binary isn't built.
      run: >
        sh -c 'bin=build/bin/plasmazones-shader-validate;
        if [ -x "$bin" ]; then exec "$bin" --quiet --pointer plasmazones/data/pointer;
        else echo "plasmazones-shader-validate not built (build/bin/) — skipping pointer shader validation; build the target to enable this local gate" >&2; fi'

commit-msg:
  commands:
    conventional-commit:
      run: |
        msg=$(head -1 {1})
        # Allow merge commits
        if echo "$msg" | grep -qE '^Merge '; then
          exit 0
        fi
        # Allow revert commits
        if echo "$msg" | grep -qE '^Revert '; then
          exit 0
        fi
        # Enforce Conventional Commits: type(scope): description
        if ! echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'; then
          echo ""
          echo "ERROR: Commit message must follow Conventional Commits format:"
          echo ""
          echo "  <type>(<scope>): <description>"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo "Scope is optional. Examples:"
          echo "  feat(autotile): add grid algorithm"
          echo "  fix: prevent SIGSEGV on hover"
          echo "  chore: bump version to 2.0.0"
          echo ""
          echo "Got: $msg"
          exit 1
        fi
